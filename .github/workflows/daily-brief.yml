name: 대학 발주 공고 데일리 브리프

on:
  schedule:
    # 평일(월~금) 오전 7시 37분 KST = 전날 22:37 UTC (일~목)
    - cron: "37 22 * * 0-4"
  workflow_dispatch:
    inputs:
      days:
        description: "최근 N일 (비우면 평일 1일, 월요일 3일)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 조회 기간 결정
        id: period
        run: |
          if [ -n "${{ github.event.inputs.days }}" ]; then
            echo "days=${{ github.event.inputs.days }}" >> "$GITHUB_OUTPUT"
          elif [ "$(TZ=Asia/Seoul date +%u)" = "1" ]; then
            echo "days=3" >> "$GITHUB_OUTPUT"     # 월요일은 주말 포함
          else
            echo "days=1" >> "$GITHUB_OUTPUT"
          fi

      - name: 나라장터 검색
        env:
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
        run: |
          if [ -z "$G2B_SERVICE_KEY" ]; then
            echo "::error::저장소 Secret G2B_SERVICE_KEY가 없습니다. Settings > Secrets and variables > Actions 에서 등록하세요."
            exit 1
          fi
          python skills/g2b-university-bids/scripts/search_bids.py \
            --days "${{ steps.period.outputs.days }}" --out reports

      - name: 실행 요약에 브리프 표시
        if: always()
        run: |
          f=$(ls -t reports/univ_bids_*.md 2>/dev/null | head -1)
          [ -n "$f" ] && cat "$f" >> "$GITHUB_STEP_SUMMARY" || echo "브리프 없음" >> "$GITHUB_STEP_SUMMARY"

      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "데일리 브리프 $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git push
          fi

      - name: 메일 발송
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: |
          pip install -q markdown
          python .github/scripts/send_brief_mail.py reports
